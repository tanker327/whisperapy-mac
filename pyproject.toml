[project]
name = "whisperapy-mac"
version = "1.1.0"
description = "Local transcription and embedding REST service on Apple Silicon (FastAPI + MLX)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mlx-whisper>=0.4",
  "mlx-embeddings>=0.1.0",
  "numpy>=1.26",
  "python-multipart>=0.0.18",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "loguru>=0.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
  "RUF012",  # mutable class attributes: pydantic models are fine
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = false  # mlx_whisper / mlx_embeddings are imported lazily

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
