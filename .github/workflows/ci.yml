name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS runner so mlx wheels resolve; MLX itself is mocked in tests,
    # so no GPU work happens here.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest
